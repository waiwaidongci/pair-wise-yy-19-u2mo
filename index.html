<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片显微照片索引台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Petrographic Slide Index</p>
        <h1>岩芯薄片显微照片索引台</h1>
      </div>
      <button id="exportBtn" type="button">导出观察清单</button>
    </header>

    <section class="layout">
      <form id="sampleForm" class="editor">
        <h2>样本录入</h2>
        <label>显微照片<input id="photoInput" type="file" accept="image/*"></label>
        <label>样本编号<input name="code" required placeholder="BX-17-03"></label>
        <label>采样地点<input name="location" placeholder="剖面东侧第二层"></label>
        <div class="pair">
          <label>放大倍数<input name="magnification" placeholder="40x"></label>
          <label>偏光类型
            <select name="polarization">
              <option>单偏光</option>
              <option>正交偏光</option>
              <option>反射光</option>
            </select>
          </label>
        </div>
        <label>主要矿物<input name="minerals" placeholder="石英、斜长石、黑云母"></label>
        <label>颗粒结构<input name="texture" placeholder="半自形粒状、碎裂结构"></label>
        <label>老师批注<textarea name="comment" rows="4" placeholder="记录鉴定依据或疑点"></textarea></label>
        <button type="submit">保存样本</button>
      </form>

      <section class="board">
        <div class="filters">
          <input id="mineralFilter" placeholder="按矿物筛选（薄片与测温点）">
          <select id="polarFilter">
            <option value="">全部偏光</option>
            <option>单偏光</option>
            <option>正交偏光</option>
            <option>反射光</option>
          </select>
        </div>
        <div id="sampleGrid" class="sample-grid"></div>

        <section class="thermo">
          <div class="thermo-head">
            <div>
              <h2>包裹体测温复核</h2>
              <p class="thermo-note">每片按矿物 + 位置只保留一个测点；同一测点同时只有一条待复核记录，复核须换人，两次温差超过 5℃ 退回返测。</p>
            </div>
            <select id="statusFilter">
              <option value="">全部状态</option>
              <option value="pending">待复核</option>
              <option value="approved">复核通过</option>
              <option value="returned">退回返测</option>
            </select>
          </div>

          <form id="pointForm" class="point-form">
            <select name="sampleId" id="pointSampleSelect" required></select>
            <input name="mineral" placeholder="矿物，如 石英">
            <input name="position" placeholder="测点位置，如 视域B 裂隙中段">
            <input name="th" type="number" step="0.1" placeholder="均一温度 ℃">
            <input name="td" type="number" step="0.1" placeholder="爆裂温度 ℃">
            <input name="observer" placeholder="初测人">
            <button type="submit">新增测点</button>
            <p id="pointFormMsg" class="form-msg" hidden></p>
          </form>

          <div id="pointList" class="point-list"></div>
        </section>
      </section>

      <aside class="compare">
        <h2>并排对比</h2>
        <div id="comparePane" class="compare-pane"></div>
      </aside>
    </section>
  </main>
  <!-- 判定（domain.js）→ 记录（store.js）→ 页面（app.js），三层分开 -->
  <script src="./domain.js"></script>
  <script src="./store.js"></script>
  <script src="./app.js"></script>
</body>
</html>
